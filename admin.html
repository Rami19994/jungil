  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Supported Image Extensions list
    const ACCEPTED_IMAGE_TYPES = "image/*, .jpg, .jpeg, .png, .webp, .svg, .gif, .avif, .bmp, .ico, .tiff, .tif, .heic, .heif";

    // --- ICONS (Lucide SVG Component Library) ---

        ),
        utensils: (

        ),

          </svg>
        ),
        layers: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>

        ),
        settings: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        ),
        upload: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        ),
        download: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        ),
        check: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        ),
        arrowLeft: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <line x1="19" y1="12" x2="5" y2="12"></line>

      return icons[name] || <span className={className}>•</span>;
    };

    const DEFAULT_SETTINGS = {
      restaurantNameEn: 'Jungle',
      restaurantNameAr: 'جانغل',
      taglineEn: 'Rooftop & Lounge Dining Experience',
      taglineAr: 'تجربة طعام وسهرات استثنائية على الروف توب',
      addressEn: 'Ankawa, Main Street, Luxury Hotel',
      addressAr: 'عنكاوة - الشارع الرئيسي - فندق luxury',
      mapUrl: 'https://maps.app.goo.gl/xiSWgf6a2JBKpTya9',
      logoUrl: '',
      heroBgUrl: 'hero-bg.jpg',
    };

    function JungleAdminApp() {
      const [lang, setLang] = useState('ar');
      const isAr = lang === 'ar';

      // Authentication state with sessionStorage persistence
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem('jungle_admin_auth') === 'true';
      });
      const [adminUsername, setAdminUsername] = useState('');
      const [adminPassword, setAdminPassword] = useState('');
      const [loginError, setLoginError] = useState(false);

      // Data States
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [settingsForm, setSettingsForm] = useState(DEFAULT_SETTINGS);
      const [categories, setCategories] = useState([]);
      const [dishes, setDishes] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      // Tabs: 'dishes' | 'settings' | 'categories'
      const [activeTab, setActiveTab] = useState('dishes');

      // Modals
      const [isDishModalOpen, setIsDishModalOpen] = useState(false);
      const [editingDish, setEditingDish] = useState(null);
      const [dishForm, setDishForm] = useState({
        nameEn: '',
        nameAr: '',
        categoryId: 'steaks',
        price: 25,
        descEn: '',
        descAr: '',
        image: '',
        isChefSpecial: false,
        isBestSeller: false,
        isVegetarian: false,
        isSpicy: false,
        inStock: true,
      });

      const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
      const [newCategoryForm, setNewCategoryForm] = useState({
        nameEn: '',
        nameAr: '',
        icon: 'utensils',
      });

      // Filter & Search inside Admin Dishes
      const [dishSearch, setDishSearch] = useState('');
      const [dishCategoryFilter, setDishCategoryFilter] = useState('all');
      const [dishImagePreview, setDishImagePreview] = useState('');
      const [isImageProcessing, setIsImageProcessing] = useState(false);

      // Toast Notifications
      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3200);
      };

      // Refs
      const logoFileInputRef = useRef(null);
      const heroBgFileInputRef = useRef(null);
      const dishImageFileInputRef = useRef(null);
      const backupFileInputRef = useRef(null);

      // Load Data from SQLite 3 Backend (Fast & Real-time directly from database)
      const loadData = async () => {
        try {
          setIsLoading(true);
          const t = Date.now();
          const fetchOpts = {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache',
            },
          };

          // Wipe any stale browser cache
          try {
            localStorage.removeItem('jungle_cache');
          } catch (_) {}

          const [settingsRes, catsRes, dishesRes] = await Promise.all([
            fetch(`/api/settings?t=${t}`, fetchOpts).catch(() => null),
            fetch(`/api/categories?t=${t}`, fetchOpts).catch(() => null),
            fetch(`/api/dishes?t=${t}`, fetchOpts).catch(() => null),
          ]);

          if (settingsRes && settingsRes.ok) {
            const data = await settingsRes.json();
            if (Object.keys(data).length > 0) {
              setSettings(data);
              setSettingsForm(data);
            }
          }

          if (catsRes && catsRes.ok) {
            const data = await catsRes.json();
            if (Array.isArray(data)) setCategories(data);
          }

          if (dishesRes && dishesRes.ok) {
            const data = await dishesRes.json();
            if (Array.isArray(data)) setDishes(data);
          }
        } catch (err) {
          console.error('Error fetching admin data from SQLite 3:', err);
        } finally {
          setIsLoading(false);
        }
      };

      // Broadcast channel for instantaneous cross-tab sync with customer menu (0ms)
      const syncChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('jungle_sync') : null;

      useEffect(() => {
        if (isAuthenticated) {
          loadData();
        }
      }, [isAuthenticated]);

      useEffect(() => {
        document.documentElement.dir = isAr ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
      }, [lang, isAr]);

      // Handle Login
      const handleLogin = (e) => {
        e.preventDefault();
        if (adminUsername.trim() === 'admin' && adminPassword.trim() === '123456') {
          setIsAuthenticated(true);
          sessionStorage.setItem('jungle_admin_auth', 'true');
          setLoginError(false);
          setAdminPassword('');
          showToast(isAr ? 'مرحباً بك في لوحة الإدارة التنفيذية' : 'Welcome to Executive Admin');
        } else {
          setLoginError(true);
        }
      };

      // Handle Logout
      const handleLogout = () => {
        setIsAuthenticated(false);
        sessionStorage.removeItem('jungle_admin_auth');
        showToast(isAr ? 'تم تسجيل الخروج بنجاح' : 'Logged out');
      };

      // Image Processing & Optimization - Uploads to /uploads/ and links to SQLite 3
      const handleFileUpload = async (file, callback, setPreview) => {
        if (!file) return;

        setIsImageProcessing(true);

        const reader = new FileReader();
        reader.onerror = () => {
          setIsImageProcessing(false);
          showToast(isAr ? 'تعذر قراءة ملف الصورة' : 'Could not read image file', 'error');
        };

        reader.onload = async (ev) => {
          const rawData = ev.target.result;
          let compressed = rawData;

          if (file.type !== 'image/svg+xml') {
            try {
              compressed = await new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                  try {
                    const maxDim = 1200;
                    let w = img.width || 800;
                    let h = img.height || 600;
                    if (w > maxDim || h > maxDim) {
                      if (w > h) {
                        h = Math.round((h * maxDim) / w);
                        w = maxDim;
                      } else {
                        w = Math.round((w * maxDim) / h);
                        h = maxDim;
                      }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, w, h);

                    let result = canvas.toDataURL('image/webp', 0.85);
                    if (!result || result.length < 100 || result === 'data:,') {
                      result = canvas.toDataURL('image/jpeg', 0.85);
                    }
                    resolve(result || rawData);
                  } catch (_) {
                    resolve(rawData);
                  }
                };
                img.onerror = () => resolve(rawData);
                img.src = rawData;
              });
            } catch (_) {
              compressed = rawData;
            }
          }

          if (setPreview) setPreview(compressed);

          // Upload image to server immediately to store clean image file on disk
          try {
            const uploadRes = await fetch('/api/upload', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ base64Data: compressed, filename: file.name }),
            });
            if (uploadRes.ok) {
              const uploadData = await uploadRes.json();
              if (uploadData.url) {
                callback(uploadData.url);
                if (setPreview) setPreview(uploadData.url);
                setIsImageProcessing(false);
                showToast(isAr ? 'تم رفع وحفظ صورة الوجبة بنجاح' : 'Image saved successfully');
                return;
              }
            }
          } catch (uploadErr) {
            console.warn('Direct upload warning, falling back to embedded format:', uploadErr);
          }

          callback(compressed);
          setIsImageProcessing(false);
          showToast(isAr ? 'تم تجهيز الصورة بنجاح' : 'Image prepared successfully');
        };

        reader.readAsDataURL(file);
      };

      // Save Settings
      const handleSaveSettings = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(settingsForm),
          });
          if (!res.ok) throw new Error('Failed to save settings');
          setSettings({ ...settingsForm });
          showToast(isAr ? 'تم حفظ وتحديث بيانات المطعم فورياً في قاعدة البيانات' : 'Restaurant info saved');
          if (syncChannel) syncChannel.postMessage({ type: 'SETTINGS_UPDATED', time: Date.now() });
        } catch (err) {
          showToast(isAr ? 'حدث خطأ أثناء الحفظ' : 'Error saving settings', 'error');
        }
      };

      // Delete Logo
      const handleDeleteLogo = async () => {
        if (!window.confirm(isAr ? 'هل أنت متأكد من رغبتك في حذف شعار المطعم نهائياً؟' : 'Are you sure you want to delete the logo?')) {
          return;
        }
        try {
          const res = await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ logoUrl: '' }),
          });
          if (!res.ok) throw new Error('Failed to delete logo');
          setSettings(prev => ({ ...prev, logoUrl: '' }));
          setSettingsForm(prev => ({ ...prev, logoUrl: '' }));
          if (logoFileInputRef.current) logoFileInputRef.current.value = '';
          showToast(isAr ? 'تم حذف الشعار نهائياً من قاعدة البيانات' : 'Logo deleted successfully');
          if (syncChannel) syncChannel.postMessage({ type: 'SETTINGS_UPDATED', time: Date.now() });
        } catch (err) {
          showToast(isAr ? 'حدث خطأ أثناء حذف الشعار' : 'Error deleting logo', 'error');
        }
      };

      // Hero Background: save a single setting value immediately ('' = no background)
      const saveHeroBg = async (url, message) => {
        setSettings(prev => ({ ...prev, heroBgUrl: url }));
        setSettingsForm(prev => ({ ...prev, heroBgUrl: url }));
        try {
          const res = await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ heroBgUrl: url }),
          });
          if (!res.ok) throw new Error('Failed to update background');
          showToast(message);
          if (syncChannel) syncChannel.postMessage({ type: 'SETTINGS_UPDATED', time: Date.now() });
        } catch (err) {
          showToast(isAr ? 'حدث خطأ أثناء حفظ الخلفية' : 'Error saving background', 'error');
        }
        if (heroBgFileInputRef.current) heroBgFileInputRef.current.value = '';
      };

      const handleDeleteHeroBg = () => {
        if (!window.confirm(isAr ? 'هل تريد حذف صورة الخلفية؟' : 'Delete the background image?')) return;
        saveHeroBg('', isAr ? 'تم حذف صورة الخلفية من قاعدة البيانات' : 'Background removed');
      };

      // Dishes: Add/Edit Modal Open
      const openAddDishModal = () => {
        setEditingDish(null);
        setDishForm({
          nameEn: '',
          nameAr: '',
          categoryId: categories[0]?.id || 'general',
          price: 25,
          descEn: '',
          descAr: '',
          image: '',
          isChefSpecial: false,
          isBestSeller: false,
          isVegetarian: false,
          isSpicy: false,
          inStock: true,
        });
        setDishImagePreview('');
        setIsImageProcessing(false);
        if (dishImageFileInputRef.current) dishImageFileInputRef.current.value = '';
        setIsDishModalOpen(true);
      };

      const openEditDishModal = (dish) => {
        setEditingDish(dish);
        setDishForm({
          nameEn: dish.nameEn || '',
          nameAr: dish.nameAr || '',
          categoryId: dish.categoryId || categories[0]?.id || 'general',
          price: dish.price || 0,
          descEn: dish.descEn || '',
          descAr: dish.descAr || '',
          image: dish.image || '',
          isChefSpecial: Boolean(dish.isChefSpecial),
          isBestSeller: Boolean(dish.isBestSeller),
          isVegetarian: Boolean(dish.isVegetarian),
          isSpicy: Boolean(dish.isSpicy),
          inStock: Boolean(dish.inStock),
        });
        setDishImagePreview(dish.image || '');
        setIsImageProcessing(false);
        if (dishImageFileInputRef.current) dishImageFileInputRef.current.value = '';
        setIsDishModalOpen(true);
      };

      // Save Dish directly into SQLite 3 Database
      const handleSaveDish = async (e) => {
        e.preventDefault();
        if (!dishForm.nameEn.trim() || !dishForm.nameAr.trim()) {
          alert(isAr ? 'يرجى إدخال اسم الوجبة بالعربية والإنجليزية' : 'Please enter item name in both languages');
          return;
        }

        const finalImage = dishForm.image !== undefined ? dishForm.image : (dishImagePreview || '');
        const dishData = {
          ...dishForm,
          image: finalImage,
          price: Number(dishForm.price) || 0,
        };

        try {
          if (editingDish) {
            const res = await fetch(`/api/dishes/${editingDish.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...dishData, id: editingDish.id }),
            });
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || (isAr ? 'فشل تحديث الوجبة في قاعدة البيانات' : 'Failed to update dish'));
            }
            const updateResult = await res.json().catch(() => ({}));
            const updatedImage = updateResult.image || finalImage;
            setDishes(prev => prev.map(d => d.id === editingDish.id ? { ...d, ...dishData, image: updatedImage } : d));
            showToast(isAr ? 'تم تحديث الوجبة والصورة بنجاح في قاعدة البيانات SQLite 3' : 'Dish updated in SQLite 3 database');
          } else {
            const newId = `dish-${Date.now()}`;
            const res = await fetch('/api/dishes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...dishData, id: newId }),
            });
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || (isAr ? 'فشل إضافة الوجبة في قاعدة البيانات' : 'Failed to add dish'));
            }
            const addResult = await res.json().catch(() => ({}));
            const savedId = addResult.id || newId;
            const savedImage = addResult.image || finalImage;
            setDishes(prev => [{ ...dishData, id: savedId, image: savedImage }, ...prev]);
            showToast(isAr ? 'تمت إضافة الوجبة وحفظها في قاعدة البيانات SQLite 3' : 'New dish added to SQLite 3 database');
          }

          setIsDishModalOpen(false);
          if (syncChannel) syncChannel.postMessage({ type: 'DISHES_UPDATED', time: Date.now() });
        } catch (err) {
          console.error('Save dish error:', err);
          showToast(err.message || (isAr ? 'حدث خطأ أثناء الحفظ' : 'Error saving dish'), 'error');
          await loadData();
        }
      };

      // Delete Dish completely from SQLite 3 Database
      const handleDeleteDish = async (dishId) => {
        if (window.confirm(isAr ? 'هل أنت متأكد من حذف هذه الوجبة نهائياً من قاعدة البيانات؟' : 'Permanently delete this dish from database?')) {
          // 1. Remove immediately from local state (0ms instant response)
          setDishes(prev => prev.filter(d => d.id !== dishId));
          if (syncChannel) syncChannel.postMessage({ type: 'DISHES_UPDATED', time: Date.now() });

          try {
            const res = await fetch(`/api/dishes/${dishId}`, { method: 'DELETE' });
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || (isAr ? 'فشل حذف الوجبة من قاعدة البيانات' : 'Failed to delete dish'));
            }
            showToast(isAr ? 'تم حذف الوجبة نهائياً من قاعدة البيانات SQLite 3' : 'Dish deleted permanently from database');
          } catch (err) {
            console.error('Delete error:', err);
            showToast(err.message || (isAr ? 'حدث خطأ أثناء الحذف' : 'Error deleting dish'), 'error');
            await loadData();
          }
        }
      };

      // Clear All Dishes to start completely fresh with real data in SQLite 3
      const handleClearAllDishes = async () => {
        if (dishes.length === 0) {
          alert(isAr ? 'لا توجد أي أطباق حالياً لحذفها' : 'No dishes to delete');
          return;
        }
        if (window.confirm(isAr ? 'هل أنت متأكد من رغبتك في حذف جميع الأطباق الحالية؟ ستصبح القائمة فارغة تماماً لتتمكن من إدخال وجباتك الحقيقية.' : 'Are you sure you want to delete ALL current dishes to start clean with real data?')) {
          setDishes([]);
          if (syncChannel) syncChannel.postMessage({ type: 'DISHES_UPDATED', time: Date.now() });

          try {
            const res = await fetch('/api/dishes/clear-all', { method: 'POST' });
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || 'Failed to clear dishes');
            }
            showToast(isAr ? 'تم حذف جميع الأطباق بنجاح من قاعدة البيانات SQLite 3' : 'All dishes cleared from SQLite 3');
          } catch (err) {
            showToast(err.message || (isAr ? 'حدث خطأ في الاتصال' : 'Connection error'), 'error');
            await loadData();
          }
        }
      };

      // Toggle Stock
      const handleToggleStock = async (dishId) => {
        const targetDish = dishes.find(d => d.id === dishId);
        if (!targetDish) return;
        const nextStock = !targetDish.inStock;

        try {
          await fetch(`/api/dishes/${dishId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...targetDish, inStock: nextStock }),
          });
          setDishes(prev => prev.map(d => d.id === dishId ? { ...d, inStock: nextStock } : d));
          showToast(`${isAr ? targetDish.nameAr : targetDish.nameEn}: ${nextStock ? (isAr ? 'متوفر' : 'In Stock') : (isAr ? 'نفذت الكمية' : 'Sold Out')}`);
          if (syncChannel) syncChannel.postMessage({ type: 'DISHES_UPDATED', time: Date.now() });
        } catch (err) { }
      };

      // Add Category
      const handleAddCategory = async (e) => {
        e.preventDefault();
        if (!newCategoryForm.nameEn.trim() || !newCategoryForm.nameAr.trim()) return;
        const newCat = {
          id: `cat-${Date.now()}`,
          nameEn: newCategoryForm.nameEn.trim(),
          nameAr: newCategoryForm.nameAr.trim(),
          icon: newCategoryForm.icon || 'utensils',
          displayOrder: categories.length + 1,
        };

        try {
          await fetch('/api/categories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newCat),
          });
          setCategories(prev => [...prev, newCat]);
          setNewCategoryForm({ nameEn: '', nameAr: '', icon: 'utensils' });
          setIsCategoryModalOpen(false);
          showToast(isAr ? 'تمت إضافة التصنيف بنجاح' : 'Category added');
          if (syncChannel) syncChannel.postMessage({ type: 'CATEGORIES_UPDATED', time: Date.now() });
        } catch (err) {
          showToast(isAr ? 'حدث خطأ أثناء الإضافة' : 'Error adding category', 'error');
        }
      };

      // Delete Category (unrestricted - user can delete any and all categories)
      const handleDeleteCategory = async (catId) => {
        if (window.confirm(isAr ? 'هل أنت متأكد من رغبتك في حذف هذا التصنيف؟ ستبقى أطباقه معروضة ضمن "جميع التصنيفات"' : 'Delete this category? Dishes will remain under All Categories.')) {
          setCategories(prev => prev.filter(c => c.id !== catId));
          setDishes(prev => prev.map(d => d.categoryId === catId ? { ...d, categoryId: '' } : d));
          if (syncChannel) syncChannel.postMessage({ type: 'CATEGORIES_UPDATED', time: Date.now() });

          try {
            await fetch(`/api/categories/${catId}`, { method: 'DELETE' });
            showToast(isAr ? 'تم حذف التصنيف بنجاح' : 'Category deleted');
          } catch (err) {
            showToast(isAr ? 'حدث خطأ أثناء الحذف' : 'Error deleting category', 'error');
            await loadData();
          }
        }
      };

      // Clear All Categories completely
      const handleClearAllCategories = async () => {
        if (categories.length === 0) {
          alert(isAr ? 'لا توجد أي تصنيفات حالياً لحذفها' : 'No categories to delete');
          return;
        }
        if (window.confirm(isAr ? 'هل أنت متأكد من رغبتك في حذف كافة التصنيفات؟ سيبقى فقط زر "جميع التصنيفات" على الصفحة الرئيسية' : 'Delete ALL categories? Only "All Categories" will remain on main page.')) {
          setCategories([]);
          setDishes(prev => prev.map(d => ({ ...d, categoryId: '' })));
          if (syncChannel) syncChannel.postMessage({ type: 'CATEGORIES_UPDATED', time: Date.now() });

          try {
            await fetch('/api/categories/clear-all', { method: 'POST' });
            showToast(isAr ? 'تم حذف جميع التصنيفات بنجاح' : 'All categories deleted');
          } catch (err) {
            showToast(err.message || (isAr ? 'حدث خطأ أثناء الحذف' : 'Error deleting categories'), 'error');
            await loadData();
          }
        }
      };

      // Backup Export JSON
      const handleExportBackup = () => {
        const backupData = {
          exportedAt: new Date().toISOString(),
          restaurant: settings.restaurantNameAr || 'Jungle Lounge',
          settings,
          categories,
          dishes,
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `jungle_lounge_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(isAr ? 'تم تنزيل النسخة الاحتياطية بنجاح' : 'Backup downloaded');
      };

      // Backup Restore JSON
      const handleImportBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const backup = JSON.parse(ev.target.result);
            if (!backup.settings && !backup.categories && !backup.dishes) {
              alert(isAr ? 'ملف النسخة الاحتياطية غير صالح' : 'Invalid backup file');
              return;
            }
            if (window.confirm(isAr ? 'هل تريد استعادة هذه النسخة وتحديث كافة الوجبات والإعدادات؟' : 'Restore backup and overwrite menu?')) {
              await fetch('/api/restore', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(backup),
              });
              if (backup.settings) {
                setSettings(backup.settings);
                setSettingsForm(backup.settings);
              }
              if (Array.isArray(backup.categories)) setCategories(backup.categories);
              if (Array.isArray(backup.dishes)) setDishes(backup.dishes);
              showToast(isAr ? 'تمت استعادة البيانات بنجاح' : 'Backup restored');
              if (syncChannel) syncChannel.postMessage({ type: 'ALL_UPDATED', time: Date.now() });
            }
          } catch (err) {
            alert(isAr ? 'خطأ في قراءة ملف النسخة الاحتياطية' : 'Error reading backup file');
          }
        };
        reader.readAsText(file);
      };

      // Filtered Dishes in Admin
      const filteredAdminDishes = useMemo(() => {
        return dishes.filter(d => {
          if (dishCategoryFilter !== 'all' && d.categoryId !== dishCategoryFilter) return false;
          if (dishSearch.trim()) {
            const q = dishSearch.toLowerCase().trim();
            const matchNameEn = d.nameEn?.toLowerCase().includes(q);
            const matchNameAr = d.nameAr?.includes(q);
            if (!matchNameEn && !matchNameAr) return false;
          }
          return true;
        });
      }, [dishes, dishCategoryFilter, dishSearch]);

      // If not authenticated, render Login Screen
      if (!isAuthenticated) {
        return (
          <div className={`min-h-screen flex items-center justify-center p-4 bg-[#070a0e] ${isAr ? 'font-arabic' : 'font-sans'}`}>
            <div className="max-w-md w-full glass-panel bg-jungle-950/95 border border-gold-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
              <div className="text-center mb-6">
                <div className="w-16 h-16 rounded-2xl bg-gold-500/10 border border-gold-500/30 flex items-center justify-center mx-auto mb-3 text-gold-400 shadow-gold-glow-sm">
                  <Icon name="shield" className="w-8 h-8" />
                </div>
                <h2 className="text-xl sm:text-2xl font-black text-slate-100 gold-gradient-text">
                  {isAr ? 'لوحة الإدارة التنفيذية' : 'Executive Admin Portal'}
                </h2>
                <p className="text-xs text-slate-400 mt-1">
                  {isAr ? 'أدخل اسم المستخدم وكلمة المرور للمتابعة' : 'Enter admin credentials to continue'}
                </p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                {loginError && (
                  <div className="p-3 rounded-xl bg-red-950/80 border border-red-500/40 text-red-300 text-xs text-center font-bold">
                    {isAr ? 'اسم المستخدم أو كلمة المرور غير صحيحة' : 'Invalid username or password'}
                  </div>
                )}

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">{isAr ? 'اسم المستخدم' : 'Username'}</label>
                  <input
                    type="text"
                    value={adminUsername}
                    onChange={(e) => setAdminUsername(e.target.value)}
                    placeholder="admin"
                    required
                    className="w-full bg-jungle-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-gold-400"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">{isAr ? 'كلمة المرور' : 'Password'}</label>
                  <input
                    type="password"
                    value={adminPassword}
                    onChange={(e) => setAdminPassword(e.target.value)}
                    placeholder="••••••"
                    required
                    className="w-full bg-jungle-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-gold-400"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3 rounded-xl bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 text-obsidian-950 font-bold text-sm shadow-gold-glow transition active:scale-95 mt-2"
                >
                  {isAr ? 'تسجيل الدخول' : 'Sign In'}
                </button>

                <div className="text-center pt-2">
                  <a
                    href="/"
                    className="text-xs text-slate-400 hover:text-gold-300 transition inline-flex items-center gap-1"
                  >
                    <span>←</span>
                    <span>{isAr ? 'العودة إلى قائمة الزبائن' : 'Back to Customer Menu'}</span>
                  </a>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // Authenticated Admin Dashboard
      return (
        <div className={`min-h-screen bg-[#070a0e] text-slate-100 ${isAr ? 'font-arabic' : 'font-sans'}`}>
          {/* Toast */}
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-4 w-full max-w-sm pointer-events-none">
              <div className="glass-panel px-4 py-2.5 rounded-full border border-gold-500/60 shadow-gold-glow flex items-center justify-center space-x-2.5 rtl:space-x-reverse bg-jungle-950/95 text-gold-300 text-xs sm:text-sm font-semibold text-center animate-bounce">
                <Icon name="sparkles" className="w-4 h-4 text-gold-400 flex-shrink-0 animate-spin" />
                <span className="truncate">{toast.message}</span>
              </div>
            </div>
          )}

          {/* Admin Header Navbar */}
          <header className="sticky top-0 z-40 glass-header border-b border-gold-500/20 shadow-2xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-3">
              <div className="flex items-center space-x-3 rtl:space-x-reverse">
                {settings.logoUrl ? (
                  <img
                    src={settings.logoUrl}
                    alt="Logo"
                    className="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-gold-500/70 object-cover shadow-gold-glow"
                  />
                ) : (
                  <div className="w-10 h-10 rounded-full bg-jungle-900 border border-gold-500/30 flex items-center justify-center text-gold-400 text-xs font-bold">
                    JL
                  </div>
                )}
                <div>
                  <h1 className="text-sm sm:text-base font-black tracking-wide text-slate-100 uppercase">
                    {isAr ? settings.restaurantNameAr : settings.restaurantNameEn}
                  </h1>
                  <span className="text-[10px] text-emerald-400 font-semibold block flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    {isAr ? 'لوحة التحكم المستقلة' : 'Admin Panel Online'}
                  </span>
                </div>
              </div>

              <div className="flex items-center space-x-2 rtl:space-x-reverse">
                <a
                  href="/"
                  target="_blank"
                  rel="noreferrer"
                  className="px-3 py-1.5 rounded-xl bg-jungle-900/90 hover:bg-gold-500 hover:text-black text-slate-200 border border-gold-500/30 text-xs font-semibold transition flex items-center space-x-1 rtl:space-x-reverse"
                >
                  <span>👁️</span>
                  <span className="hidden sm:inline">{isAr ? 'معاينة القائمة' : 'Preview Menu'}</span>
                </a>

                <button
                  onClick={() => setLang(prev => prev === 'en' ? 'ar' : 'en')}
                  className="px-2.5 py-1.5 rounded-xl bg-jungle-900/90 text-gold-300 border border-gold-500/30 text-xs font-bold transition flex items-center space-x-1 rtl:space-x-reverse"
                >
                  <Icon name="globe" className="w-3.5 h-3.5" />
                  <span>{lang === 'en' ? 'العربية' : 'EN'}</span>
                </button>

                <button
                  onClick={handleLogout}
                  className="px-3 py-1.5 rounded-xl bg-red-950/80 hover:bg-red-600 text-red-300 hover:text-white border border-red-500/40 text-xs font-bold transition"
                >
                  {isAr ? 'خروج' : 'Log Out'}
                </button>
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">
            {/* Metric Summary Cards */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
              <div className="glass-card rounded-2xl p-4 border border-gold-500/20">
                <div className="flex items-center justify-between text-slate-400 text-xs mb-1">
                  <span>{isAr ? 'إجمالي الوجبات' : 'Total Dishes'}</span>
                  <Icon name="utensils" className="w-4 h-4 text-gold-400" />
                </div>
                <div className="text-2xl sm:text-3xl font-black text-slate-100">{dishes.length}</div>
              </div>

              <div className="glass-card rounded-2xl p-4 border border-gold-500/20">
                <div className="flex items-center justify-between text-slate-400 text-xs mb-1">
                  <span>{isAr ? 'التصنيفات' : 'Categories'}</span>
                  <Icon name="layers" className="w-4 h-4 text-emerald-400" />
                </div>
                <div className="text-2xl sm:text-3xl font-black text-slate-100">{categories.length}</div>
              </div>

              <div className="glass-card rounded-2xl p-4 border border-gold-500/20">
                <div className="flex items-center justify-between text-slate-400 text-xs mb-1">
                  <span>{isAr ? 'غير متوفر' : 'Sold Out'}</span>
                  <Icon name="flame" className="w-4 h-4 text-amber-400" />
                </div>
                <div className="text-2xl sm:text-3xl font-black text-amber-300">
                  {dishes.filter(d => !d.inStock).length}
                </div>
              </div>
            </div>

            {/* Admin Tabs */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div className="flex items-center space-x-2 rtl:space-x-reverse bg-jungle-950 p-1.5 rounded-xl border border-gold-500/20 overflow-x-auto">
                <button
                  onClick={() => setActiveTab('dishes')}
                  className={`px-3.5 sm:px-4 py-2 rounded-lg text-xs font-bold transition flex-shrink-0 ${activeTab === 'dishes' ? 'bg-gold-500 text-obsidian-950 shadow' : 'text-slate-300'}`}
                >
                  {isAr ? 'إدارة الوجبات' : 'Dishes'} ({dishes.length})
                </button>
                <button
                  onClick={() => setActiveTab('settings')}
                  className={`px-3.5 sm:px-4 py-2 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 rtl:space-x-reverse flex-shrink-0 ${activeTab === 'settings' ? 'bg-gold-500 text-obsidian-950 shadow' : 'text-slate-300'}`}
                >
                  <Icon name="settings" className="w-3.5 h-3.5" />
                  <span>{isAr ? 'بيانات وهوية المطعم' : 'Restaurant Info'}</span>
                </button>
                <button
                  onClick={() => setActiveTab('categories')}
                  className={`px-3.5 sm:px-4 py-2 rounded-lg text-xs font-bold transition flex-shrink-0 ${activeTab === 'categories' ? 'bg-gold-500 text-obsidian-950 shadow' : 'text-slate-300'}`}
                >
                  {isAr ? 'التصنيفات' : 'Categories'} ({categories.length})
                </button>
              </div>

              <div className="flex items-center gap-2">
                {activeTab === 'dishes' && (
                  <>
                    {dishes.length > 0 && (
                      <button
                        onClick={handleClearAllDishes}
                        className="px-3.5 py-2.5 rounded-xl bg-red-950/80 hover:bg-red-700 text-red-200 border border-red-500/40 font-bold text-xs shadow transition flex items-center space-x-1.5 rtl:space-x-reverse active:scale-95"
                        title={isAr ? 'حذف كافة الأطباق للبدء ببيانات حقيقية' : 'Clear all current dishes'}
                      >
                        <Icon name="trash" className="w-3.5 h-3.5" />
                        <span>{isAr ? 'حذف كافة الأطباق (بدء جديد)' : 'Clear All Dishes'}</span>
                      </button>
                    )}

                        <span>{isAr ? 'النسخ الاحتياطي واستعادة البيانات' : 'Data Backup & Restore'}</span>
                      </h4>
                      <p className="text-[11px] text-slate-400 mt-1 max-w-md">
                        {isAr ? 'احفظ نسخة من كافة الوجبات والإعدادات والأسعار بصيغة JSON على جهازك أو استعدها في أي وقت بنقرة واحدة' : 'Download a full backup of all dishes, categories, and settings, or restore from a backup file'}
                      </p>
                    </div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <input
                        ref={backupFileInputRef}
                        type="file"
                        accept=".json,application/json"
                        onChange={handleImportBackup}
                        className="hidden"
                      />
                      <button
                        type="button"
                        onClick={handleExportBackup}
                        className="px-3.5 py-2 rounded-xl bg-jungle-800 hover:bg-gold-500 hover:text-black text-slate-200 border border-gold-500/30 text-xs font-bold transition flex items-center space-x-1.5 rtl:space-x-reverse"
                      >
                        <Icon name="download" className="w-3.5 h-3.5" />
                        <span>{isAr ? 'تصدير نسخة احتياطية' : 'Export Backup'}</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => backupFileInputRef.current.click()}
                        className="px-3.5 py-2 rounded-xl bg-emerald-950/80 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/40 text-xs font-bold transition flex items-center space-x-1.5 rtl:space-x-reverse"
                      >
                        <Icon name="upload" className="w-3.5 h-3.5" />
                        <span>{isAr ? 'استعادة نسخة احتياطية' : 'Restore Backup'}</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: CATEGORIES MANAGEMENT */}
            {activeTab === 'categories' && (
              categories.length === 0 ? (
                <div className="text-center py-16 glass-panel rounded-2xl max-w-md mx-auto p-8 border border-gold-500/20">
                  <Icon name="layers" className="w-12 h-12 text-gold-400/60 mx-auto mb-3" />
                  <p className="text-slate-200 font-bold mb-1">{isAr ? 'تم حذف كافة التصنيفات' : 'All Categories Deleted'}</p>
                  <p className="text-xs text-slate-400 mb-4">{isAr ? 'في صفحة المنيو للزبائن، يظهر الآن فقط زر "جميع التصنيفات" لكافة الأطباق.' : 'On the customer menu, only "All Categories" remains active.'}</p>
                  <button
                    onClick={() => setIsCategoryModalOpen(true)}
                    className="px-5 py-2.5 rounded-xl bg-gold-500 text-obsidian-950 font-bold text-xs shadow-gold-glow hover:bg-gold-400 transition"
                  >
                    {isAr ? '+ إضافة تصنيف جديد' : '+ Add New Category'}
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  {categories.map((cat) => {
                    const catDishesCount = dishes.filter(d => d.categoryId === cat.id).length;
                    return (
                      <div key={cat.id} className="glass-card rounded-2xl p-5 border border-gold-500/20 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <div className="w-10 h-10 rounded-xl bg-jungle-800 border border-gold-500/30 flex items-center justify-center text-gold-400">
                              <Icon name={cat.icon || 'utensils'} className="w-5 h-5" />
                            </div>
                            <span className="text-xs px-2.5 py-1 rounded-full bg-jungle-950 border border-gold-500/30 text-gold-300 font-bold">
                              {catDishesCount} {isAr ? 'وجبة' : 'items'}
                            </span>
                          </div>
                          <h4 className="text-base font-bold text-slate-100">{cat.nameAr}</h4>
                          <p className="text-gold-300 text-sm mt-0.5">{cat.nameEn}</p>
                        </div>
                        <div className="mt-4 pt-3 border-t border-slate-800 flex justify-end">
                          <button
                            onClick={() => handleDeleteCategory(cat.id)}
                            className="px-3 py-1.5 rounded-lg bg-red-950/60 hover:bg-red-600 text-red-300 text-xs font-semibold transition"
                          >
                            {isAr ? 'حذف التصنيف' : 'Delete Category'}
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )
            )}
          </main>

          {/* DISH ADD/EDIT MODAL */}
          {isDishModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-3 sm:p-4 backdrop-blur-md overflow-y-auto">
              <div className="max-w-2xl w-full glass-panel bg-jungle-950/98 border border-gold-500/40 rounded-3xl p-5 sm:p-7 shadow-2xl relative my-6 max-h-[92vh] overflow-y-auto">
                <button
                  onClick={() => setIsDishModalOpen(false)}
                  className="absolute top-3.5 right-3.5 rtl:right-auto rtl:left-3.5 p-2 rounded-full bg-obsidian-900 text-slate-400 hover:text-white"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <h3 className="text-lg sm:text-xl font-bold text-slate-100 gold-gradient-text mb-3">
                  {editingDish ? (isAr ? 'تعديل الوجبة' : 'Edit Dish') : (isAr ? 'إضافة وجبة جديدة للقائمة' : 'Add New Dish')}
                </h3>

                <form onSubmit={handleSaveDish} className="space-y-3.5 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-300 mb-1">{isAr ? 'اسم الوجبة (بالعربية)' : 'Name (Arabic)'}</label>
                      <input
                        type="text"
                        value={dishForm.nameAr}
                        onChange={(e) => setDishForm({ ...dishForm, nameAr: e.target.value })}
                        required
                        dir="rtl"
                        placeholder="مثال: ستيك واغيو فاخر"
                        className="w-full bg-jungle-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-gold-400 font-arabic"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-300 mb-1">{isAr ? 'اسم الوجبة (بالإنكليزية)' : 'Name (English)'}</label>
                      <input
                        type="text"
                        value={dishForm.nameEn}
                        onChange={(e) => setDishForm({ ...dishForm, nameEn: e.target.value })}
                        required
                        dir="ltr"
                        placeholder="e.g. Wagyu Ribeye Steak"
                        className="w-full bg-jungle-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-gold-400"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-300 mb-1">{isAr ? 'التصنيف' : 'Category'}</label>
                      <select
                        value={dishForm.categoryId}
                        onChange={(e) => setDishForm({ ...dishForm, categoryId: e.target.value })}
                        className="w-full bg-jungle-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-gold-400"
                      >
                        {categories.length === 0 ? (
                          <option value="general">{isAr ? 'عام (بدون تصنيف)' : 'General (No Category)'}</option>
                        ) : (
                          categories.map(c => (
                            <option key={c.id} value={c.id}>
                              {c.nameAr} ({c.nameEn})
                            </option>
                          ))
                        )}
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-300 mb-1">{isAr ? 'السعر' : 'Price'}</label>
                      <input
                        type="number"
                        min="1"
                        step="1"
                        value={dishForm.price}
                        onChange={(e) => setDishForm({ ...dishForm, price: e.target.value })}
                        required
                        className="w-full bg-jungle-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-gold-400"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-300 mb-1">{isAr ? 'الوصف ومكونات التحضير (بالعربية)' : 'Description (Arabic)'}</label>
                      <textarea
                        rows="2"
                        dir="rtl"
                        value={dishForm.descAr}
                        onChange={(e) => setDishForm({ ...dishForm, descAr: e.target.value })}
                        placeholder="طريقة التحضير، المكونات، الطعم..."
                        className="w-full bg-jungle-900 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:border-gold-400 font-arabic resize-none"
                      ></textarea>
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-300 mb-1">{isAr ? 'الوصف (بالإنكليزية)' : 'Description (English)'}</label>
                      <textarea
                        rows="2"
                        dir="ltr"
                        value={dishForm.descEn}
                        onChange={(e) => setDishForm({ ...dishForm, descEn: e.target.value })}
                        placeholder="Culinary description, preparation, taste..."
                        className="w-full bg-jungle-900 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:border-gold-400 resize-none"
                      ></textarea>
                    </div>
                  </div>

                  {/* Dish Photo: Pure Device Upload */}
                  <div className="p-3.5 sm:p-4 rounded-xl bg-jungle-900/70 border border-gold-500/20">
                    <label className="block font-semibold text-slate-200 mb-2 text-xs sm:text-sm">
                      {isAr ? 'صورة الوجبة (رفع مباشر من جهازك - جميع الصيغ)' : 'Dish Photo (Upload from Device)'}
                    </label>

                    <input
                      ref={dishImageFileInputRef}
                      type="file"
                      accept={ACCEPTED_IMAGE_TYPES}
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) handleFileUpload(file, (url) => setDishForm(prev => ({ ...prev, image: url })), setDishImagePreview);
                      }}
                      className="hidden"
                    />

                    {isImageProcessing ? (
                      <div className="rounded-xl p-6 border-2 border-dashed border-gold-500/60 bg-jungle-950/80 flex flex-col items-center justify-center space-y-2">
                        <div className="w-8 h-8 border-2 border-gold-400 border-t-transparent rounded-full animate-spin"></div>
                        <p className="text-xs font-bold text-gold-300">
                          {isAr ? 'جاري ضغط ومعالجة الصورة وتجهيزها للحفظ في قاعدة البيانات...' : 'Processing and preparing image for database...'}
                        </p>
                      </div>
                    ) : (dishImagePreview || dishForm.image) ? (
                      <div className="flex items-center gap-4">
                        <div className="relative w-24 h-24 sm:w-28 sm:h-28 rounded-xl overflow-hidden border-2 border-gold-500/60 shadow-lg flex-shrink-0 bg-jungle-950">
                          <img
                            src={dishImagePreview || dishForm.image}
                            alt="Dish Preview"
                            className="w-full h-full object-cover"
                            onError={(e) => {
                              if (dishImagePreview && e.target.src !== dishImagePreview) {
                                e.target.src = dishImagePreview;
                              }
                            }}
                          />
                        </div>
                        <div className="space-y-2 flex-1">
                          <button
                            type="button"
                            onClick={() => dishImageFileInputRef.current.click()}
                            className="px-3.5 py-2 rounded-xl bg-jungle-800 hover:bg-gold-500 hover:text-black text-slate-200 border border-gold-500/40 text-xs font-bold transition flex items-center space-x-1.5 rtl:space-x-reverse"
                          >
                            <Icon name="upload" className="w-3.5 h-3.5" />
                            <span>{isAr ? 'تغيير الصورة من جهازك' : 'Change Photo from Device'}</span>
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setDishForm(prev => ({ ...prev, image: '' }));
                              setDishImagePreview('');
                              if (dishImageFileInputRef.current) dishImageFileInputRef.current.value = '';
                            }}
                            className="px-3.5 py-1.5 rounded-xl bg-red-950/80 hover:bg-red-600 text-red-300 hover:text-white border border-red-500/40 text-xs font-bold transition flex items-center space-x-1.5 rtl:space-x-reverse"
                          >
                            <Icon name="trash" className="w-3.5 h-3.5" />
                            <span>{isAr ? 'حذف صورة الوجبة' : 'Remove Photo'}</span>
                          </button>
                          <p className="text-[11px] text-slate-400">JPG, PNG, WEBP, SVG, GIF, AVIF, HEIC</p>
                        </div>
                      </div>
                    ) : (
                      <div
                        onClick={() => dishImageFileInputRef.current.click()}
                        className="cursor-pointer border-2 border-dashed border-gold-500/40 hover:border-gold-400 rounded-xl p-5 text-center bg-jungle-950/60 hover:bg-jungle-900/50 transition flex flex-col items-center justify-center space-y-2 group"
                      >
                        <div className="w-12 h-12 rounded-full bg-jungle-800 group-hover:bg-gold-500 group-hover:text-black text-gold-400 flex items-center justify-center transition shadow-gold-glow-sm">
                          <Icon name="upload" className="w-6 h-6" />
                        </div>
                        <div>
                          <p className="text-xs sm:text-sm font-bold text-slate-200 group-hover:text-gold-300 transition">
                            {isAr ? 'اضغط هنا لاختيار ورفع صورة الوجبة من جهازك' : 'Click here to upload dish photo from your device'}
                          </p>
                          <p className="text-[11px] text-slate-400 mt-0.5">
                            {isAr ? 'يقبل كافة لواحق الصور (JPG, PNG, WEBP, SVG, GIF, AVIF...)' : 'All image formats supported'}
                          </p>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="pt-2 border-t border-slate-800 space-y-2.5">
                    <label className="block font-semibold text-slate-300">{isAr ? 'الشارات والمميزات' : 'Tags'}</label>
                    <div className="flex flex-wrap gap-3">
                      <label className="flex items-center space-x-1.5 rtl:space-x-reverse cursor-pointer">
                        <input
                          type="checkbox"
                          checked={dishForm.isChefSpecial}
                          onChange={(e) => setDishForm({ ...dishForm, isChefSpecial: e.target.checked })}
                          className="rounded text-gold-500"
                        />
                        <span className="text-gold-300 font-semibold">★ {isAr ? 'لمسة الشيف' : 'Chef'}</span>
                      </label>
                      <label className="flex items-center space-x-1.5 rtl:space-x-reverse cursor-pointer">
                        <input
                          type="checkbox"
                          checked={dishForm.isBestSeller}
                          onChange={(e) => setDishForm({ ...dishForm, isBestSeller: e.target.checked })}
                          className="rounded text-amber-500"
                        />
                        <span className="text-amber-300 font-semibold">🔥 {isAr ? 'الأكثر طلباً' : 'Best'}</span>
                      </label>
                      <label className="flex items-center space-x-1.5 rtl:space-x-reverse cursor-pointer">
                        <input
                          type="checkbox"
                          checked={dishForm.isVegetarian}
                          onChange={(e) => setDishForm({ ...dishForm, isVegetarian: e.target.checked })}
                          className="rounded text-emerald-500"
                        />
                        <span className="text-emerald-300 font-semibold">🌿 {isAr ? 'نباتي' : 'Veg'}</span>
                      </label>
                      <label className="flex items-center space-x-1.5 rtl:space-x-reverse cursor-pointer">
                        <input
                          type="checkbox"
                          checked={dishForm.isSpicy}
                          onChange={(e) => setDishForm({ ...dishForm, isSpicy: e.target.checked })}
                          className="rounded text-red-500"
                        />
                        <span className="text-red-300 font-semibold">🌶️ {isAr ? 'حار' : 'Spicy'}</span>
                      </label>
                    </div>

                    <div className="pt-1">
                      <label className="block font-semibold text-slate-300 mb-1">{isAr ? 'حالة التوفر' : 'Stock Availability'}</label>
                      <button
                        type="button"
                        onClick={() => setDishForm({ ...dishForm, inStock: !dishForm.inStock })}
                        className={`px-3 py-1.5 rounded-xl font-bold transition flex items-center space-x-1.5 rtl:space-x-reverse ${dishForm.inStock ? 'bg-emerald-950 text-emerald-300 border border-emerald-500/50' : 'bg-red-950 text-red-300 border border-red-500/50'}`}
                      >
                        <span>{dishForm.inStock ? '✓' : '✕'}</span>
                        <span>{dishForm.inStock ? (isAr ? 'متوفر حالياً' : 'In Stock') : (isAr ? 'نفذت الكمية' : 'Sold Out')}</span>
                      </button>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-800 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsDishModalOpen(false)}
                      className="px-4 py-2 rounded-xl bg-obsidian-800 text-slate-300 font-semibold"
                    >
                      {isAr ? 'إلغاء' : 'Cancel'}
                    </button>
                    <button
                      type="submit"
                      disabled={isImageProcessing}
                      className={`px-5 py-2 rounded-xl font-bold shadow-gold-glow transition flex items-center space-x-2 rtl:space-x-reverse ${isImageProcessing ? 'bg-gold-500/50 cursor-not-allowed text-obsidian-900' : 'bg-gold-500 text-obsidian-950 hover:bg-gold-400'}`}
                    >
                      {isImageProcessing ? (
                        <span>{isAr ? 'جاري تجهيز الصورة...' : 'Processing Photo...'}</span>
                      ) : (
                        <span>{isAr ? 'حفظ الوجبة' : 'Save Dish'}</span>
                      )}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CATEGORY ADD MODAL */}
          {isCategoryModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-3 sm:p-4 backdrop-blur-sm">
              <div className="max-w-md w-full glass-panel bg-jungle-950 border border-gold-500/40 rounded-3xl p-5 sm:p-6 shadow-2xl relative">
                <button
                  onClick={() => setIsCategoryModalOpen(false)}
                  className="absolute top-3.5 right-3.5 rtl:right-auto rtl:left-3.5 p-2 rounded-full bg-obsidian-900 text-slate-400 hover:text-white"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <h3 className="text-lg font-bold text-slate-100 gold-gradient-text mb-3">
                  {isAr ? 'إضافة تصنيف جديد' : 'Add New Category'}
                </h3>

                <form onSubmit={handleAddCategory} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-300 mb-1">{isAr ? 'اسم التصنيف (بالعربية)' : 'Category Name (Arabic)'}</label>
                    <input
                      type="text"
                      value={newCategoryForm.nameAr}
                      onChange={(e) => setNewCategoryForm({ ...newCategoryForm, nameAr: e.target.value })}
                      required
                      dir="rtl"
                      placeholder="مثال: مأكولات بحرية فاخرة"
                      className="w-full bg-jungle-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-gold-400 font-arabic"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-300 mb-1">{isAr ? 'اسم التصنيف (بالإنكليزية)' : 'Category Name (English)'}</label>
                    <input
                      type="text"
                      value={newCategoryForm.nameEn}
                      onChange={(e) => setNewCategoryForm({ ...newCategoryForm, nameEn: e.target.value })}
                      required
                      dir="ltr"
                      placeholder="e.g. Premium Seafood"
                      className="w-full bg-jungle-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-gold-400"
                    />
                  </div>

                  <div className="pt-3 border-t border-slate-800 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsCategoryModalOpen(false)}
                      className="px-4 py-2 rounded-xl bg-obsidian-800 text-slate-300 font-semibold"
                    >
                      {isAr ? 'إلغاء' : 'Cancel'}
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-gold-500 text-obsidian-950 font-bold shadow-gold-glow hover:bg-gold-400"
                    >
                      {isAr ? 'إضافة التصنيف' : 'Add Category'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<JungleAdminApp />);
  </script>
</body>

</html>
