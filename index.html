  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html,
    body {
      background-color: #070a0e;
      color: #e2e8f0;
      overflow-x: hidden;
      min-height: 100vh;
      width: 100%;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #070a0e;
    }

    ::-webkit-scrollbar-thumb {
      background: #0b3b2c;
      border-radius: 9999px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #d4af37;
    }

    .glass-panel {
      background: rgba(13, 23, 20, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.16);
    }

    .glass-header {
      background: rgba(6, 35, 25, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.18);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(13, 24, 21, 0.88) 0%, rgba(9, 15, 14, 0.95) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.13);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.45);
      box-shadow: 0 14px 40px -10px rgba(0, 0, 0, 0.85), 0 0 25px rgba(212, 175, 55, 0.18);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #fcedb3 0%, #d4af37 50%, #aa8010 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .mobile-safe-bottom {
      padding-bottom: calc(var(--sab) + 72px);
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalScaleUp {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .animate-fadeIn {
      animation: modalFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-scaleUp {
      animation: modalScaleUp 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

    // --- DEFAULT INITIAL STATE DATA ---
    const DEFAULT_SETTINGS = {
      restaurantNameEn: 'Jungle',
      restaurantNameAr: 'جانغل',
      taglineEn: 'Rooftop & Lounge Dining Experience',
      taglineAr: 'تجربة طعام وسهرات استثنائية على الروف توب',
      addressEn: 'Ankawa, Main Street, Luxury Hotel',
      addressAr: 'عنكاوة - الشارع الرئيسي - فندق luxury',
      mapUrl: 'https://maps.app.goo.gl/xiSWgf6a2JBKpTya9',
      logoUrl: '',
      heroBgUrl: 'hero-bg.jpg',
    };

    // --- MAIN REACT APPLICATION COMPONENT ---
    function JungleLoungeApp() {
      // States
      const [lang, setLang] = useState('en'); // Default to English
      const [viewMode, setViewMode] = useState('grid'); // 'grid' | 'list'

      // Dynamic Settings
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);

      // Data: Dishes & Categories
      const [categories, setCategories] = useState([]);
      const [dishes, setDishes] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      // Filters & Search
      const [activeCategory, setActiveCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeTagFilter, setActiveTagFilter] = useState('all');

      // Modals
      const [selectedDishDetail, setSelectedDishDetail] = useState(null);

      // Toast Alerts
      const [toast, setToast] = useState(null);

      const isAr = lang === 'ar';
      const searchInputRef = useRef(null);

      // Show Toast Notification
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3200);
      };

      // Load Data directly from SQLite 3 Backend (Live & Real-time, No Cache, No LocalStorage Fallback)
      const loadData = async (showLoading = true) => {
        try {
          if (showLoading) setIsLoading(true);
          const t = Date.now();
          const fetchOpts = {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache',
            },
          };

          // Completely remove any old stale cache from localStorage so deleted dishes never return
          try {
            localStorage.removeItem('jungle_cache');
          } catch (_) {}

          const menuRes = await fetch(`/api/menu?t=${t}`, fetchOpts);
          const menuData = await menuRes.json();
          if (!menuRes.ok) {
            throw new Error(menuData.error || `Menu request failed (${menuRes.status})`);
          }
          if (menuData.settings && Object.keys(menuData.settings).length > 0) {
            setSettings(menuData.settings);
          }
          if (Array.isArray(menuData.categories)) setCategories(menuData.categories);
          if (Array.isArray(menuData.dishes)) setDishes(menuData.dishes);
        } catch (err) {
          console.error('Error reading directly from SQLite 3 database:', err);
          showToast(err.message || (isAr ? 'تعذّر تحميل بيانات القائمة' : 'Could not load menu data'), 'error');
        } finally {
          if (showLoading) setIsLoading(false);
        }
      };

      useEffect(() => {
        loadData(true);

        // Instant cross-tab broadcast synchronization (0ms latency)
        const syncChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('jungle_sync') : null;
        if (syncChannel) {
          syncChannel.onmessage = () => {
            loadData(false);
          };
        }

        // Live Real-Time Auto Sync across all visitor devices without page refresh (every 2.5s)
        let lastVersion = null;
        const interval = setInterval(async () => {
          try {
            const res = await fetch('/api/menu-version?t=' + Date.now(), { cache: 'no-store' });
            if (res.ok) {
              const data = await res.json();
              if (data.version && lastVersion && data.version !== lastVersion) {
                lastVersion = data.version;
                loadData(false);
              } else if (data.version) {
                lastVersion = data.version;
              }
            }
          } catch (_) {}
        }, 2500);

        return () => {
          if (syncChannel) syncChannel.close();
          clearInterval(interval);
        };
      }, []);

      // URL Route Handler for /admin and #admin -> redirects to dedicated admin page
      useEffect(() => {
        const handleAdminRoute = () => {
          const path = window.location.pathname.toLowerCase();
          const hash = window.location.hash.toLowerCase();
          const isAdminPath = path === '/admin' || path.endsWith('/admin') || hash === '#admin' || hash === '#/admin';

          if (isAdminPath) {
            window.location.href = '/admin';
          }
        };

        handleAdminRoute();
        window.addEventListener('popstate', handleAdminRoute);
        window.addEventListener('hashchange', handleAdminRoute);
        return () => {
          window.removeEventListener('popstate', handleAdminRoute);
          window.removeEventListener('hashchange', handleAdminRoute);
        };
      }, []);

      // Update Language & Direction
      useEffect(() => {
        document.documentElement.dir = isAr ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
        document.title = isAr
          ? `${settings.restaurantNameAr} | قائمة الطعام الفاخرة`
          : `${settings.restaurantNameEn} | Luxury Digital Menu`;
      }, [lang, isAr, settings]);

      // Fallback activeCategory to 'all' if selected category is deleted
      useEffect(() => {
        if (activeCategory !== 'all' && !categories.some(c => c.id === activeCategory)) {
          setActiveCategory('all');
        }
      }, [categories, activeCategory]);

      // Handle Escape key and disable background scrolling when modal is open
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setSelectedDishDetail(null);
          }
        };

        if (selectedDishDetail) {
          window.addEventListener('keydown', handleKeyDown);
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = '';
        };
      }, [selectedDishDetail]);

      // Format Price (pure number, zero currency)
      const formatPrice = (price) => {
        return Number(price) || 0;
      };

      // Filtered Dishes
      const filteredDishes = useMemo(() => {
        return dishes.filter(dish => {
          if (activeCategory !== 'all' && dish.categoryId !== activeCategory) return false;

            const matchDescAr = dish.descAr?.includes(query);

          return true;

            </section>
          </main>

          {/* ========================================================
             MOBILE BOTTOM NAVIGATION BAR
             ======================================================== */}

          <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-jungle-950/95 backdrop-blur-xl border-t border-gold-500/30 px-3 py-2 shadow-2xl pb-[calc(env(safe-area-inset-bottom,0px)+8px)]">
            <div className="flex items-center justify-around text-center">
              {/* Menu Tab */}
              <button
                onClick={() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                className="flex flex-col items-center text-slate-300 hover:text-gold-300 transition py-1"
              >
                <Icon name="utensils" className="w-5 h-5 text-gold-400" />
                <span className="text-[10px] font-semibold mt-1">{isAr ? 'القائمة' : 'Menu'}</span>
              </button>

              {/* Search Quick Tab */}
              <button
                onClick={() => {
                  window.scrollTo({ top: 380, behavior: 'smooth' });
                  setTimeout(() => { if (searchInputRef.current) searchInputRef.current.focus(); }, 350);
                }}
                className="flex flex-col items-center text-slate-300 hover:text-gold-300 transition py-1"
              >
                <Icon name="search" className="w-5 h-5" />
                <span className="text-[10px] font-semibold mt-1">{isAr ? 'بحث' : 'Search'}</span>
              </button>

              {/* Language Switch */}
              <button
                onClick={() => setLang(prev => prev === 'en' ? 'ar' : 'en')}
                className="flex flex-col items-center text-slate-300 hover:text-gold-300 transition py-1"
              >
                <Icon name="globe" className="w-5 h-5" />
                <span className="text-[10px] font-semibold mt-1">{lang === 'en' ? 'عربي' : 'EN'}</span>
              </button>
            </div>
          </div>


          {/* ========================================================
             DISH DETAIL POPUP MODAL (ENLARGED IMAGE & MEAL DESCRIPTION)
             ======================================================== */}
          {selectedDishDetail && (
            <div
              onClick={(e) => {
                if (e.target === e.currentTarget) setSelectedDishDetail(null);
              }}
              className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-3 sm:p-5 backdrop-blur-md overflow-y-auto animate-fadeIn"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="max-w-md sm:max-w-xl md:max-w-2xl w-full glass-panel bg-[#061e15]/98 border border-gold-500/40 rounded-3xl overflow-hidden shadow-2xl relative my-auto max-h-[92vh] flex flex-col animate-scaleUp"
              >
                {/* Close Button */}
                <button
                  onClick={() => setSelectedDishDetail(null)}
                  className="absolute top-3.5 right-3.5 rtl:right-auto rtl:left-3.5 z-30 p-2 sm:p-2.5 rounded-full bg-black/75 hover:bg-black text-slate-200 hover:text-gold-300 border border-gold-500/40 hover:border-gold-400 transition-all shadow-xl active:scale-95"
                  aria-label={isAr ? 'إغلاق' : 'Close'}
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                {/* ENLARGED IMAGE SECTION */}
                {selectedDishDetail.image ? (
                  <div className="relative w-full max-h-[50vh] sm:max-h-[56vh] bg-[#020806] flex items-center justify-center overflow-hidden flex-shrink-0 group">
                    <img
                      src={selectedDishDetail.image}
                      alt={selectedDishDetail.nameEn || selectedDishDetail.nameAr}
                      className="w-full h-full max-h-[50vh] sm:max-h-[56vh] object-cover sm:object-contain transition-transform duration-700 group-hover:scale-105"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#061e15] via-transparent to-black/40 pointer-events-none"></div>

                    {/* Price Badge on bottom of image */}
                    <div className="absolute bottom-3.5 left-3.5 rtl:left-auto rtl:right-3.5 pointer-events-none">
                      <span className="glass-panel px-4 py-1.5 rounded-full text-gold-300 font-black text-base sm:text-xl border border-gold-500/60 shadow-gold-glow backdrop-blur-xl">
                        {formatPrice(selectedDishDetail.price)}
                      </span>
                    </div>

                    {/* Stock Status Badge on bottom of image */}
                    <div className="absolute bottom-3.5 right-3.5 rtl:right-auto rtl:left-3.5 pointer-events-none">
                      <span className={`text-xs px-3.5 py-1 rounded-full font-bold border backdrop-blur-md ${selectedDishDetail.inStock ? 'bg-emerald-950/90 text-emerald-300 border-emerald-500/50' : 'bg-red-950/90 text-red-300 border-red-500/50'}`}>
                        {selectedDishDetail.inStock ? (isAr ? 'متوفر حالياً' : 'In Stock') : (isAr ? 'نفذت الكمية' : 'Sold Out')}
                      </span>
                    </div>
                  </div>
                ) : (
                  <div className="relative aspect-video w-full bg-gradient-to-br from-jungle-900 via-obsidian-900 to-jungle-950 flex flex-col items-center justify-center border-b border-gold-500/20 flex-shrink-0">
                    <div className="w-20 h-20 rounded-2xl bg-jungle-800/80 border border-gold-500/30 flex items-center justify-center text-gold-400 shadow-gold-glow">
                      <Icon name="utensils" className="w-10 h-10" />
                    </div>
                    <span className="text-xs sm:text-sm text-gold-400/90 font-semibold mt-3">{isAr ? 'قائمة جانغل الفاخرة' : 'Jungle Cuisine'}</span>
                    <div className="absolute bottom-3.5 left-3.5 rtl:left-auto rtl:right-3.5">
                      <span className="glass-panel px-4 py-1.5 rounded-full text-gold-300 font-black text-base sm:text-xl border border-gold-500/50 shadow-gold-glow">
                        {formatPrice(selectedDishDetail.price)}
                      </span>
                    </div>
                  </div>
                )}

                {/* DETAILS & MEAL DESCRIPTION (DIRECTLY BELOW THE IMAGE) */}
                <div className="p-4 sm:p-6 overflow-y-auto flex-1 space-y-4">
                  {/* Badges */}
                  <div className="flex flex-wrap gap-1.5">
                    {selectedDishDetail.isChefSpecial && (
                      <span className="bg-gold-500/20 text-gold-300 text-[11px] px-2.5 py-1 rounded-lg font-bold border border-gold-500/40 flex items-center gap-1">
                        <span>★</span>
                        <span>{isAr ? 'لمسة الشيف الخاصة' : "Chef's Special"}</span>
                      </span>
                    )}
                    {selectedDishDetail.isBestSeller && (
                      <span className="bg-amber-500/20 text-amber-300 text-[11px] px-2.5 py-1 rounded-lg font-bold border border-amber-500/40 flex items-center gap-1">
                        <span>🔥</span>
                        <span>{isAr ? 'الأكثر طلباً' : 'Best Seller'}</span>
                      </span>
                    )}
                    {selectedDishDetail.isVegetarian && (
                      <span className="bg-emerald-500/20 text-emerald-300 text-[11px] px-2.5 py-1 rounded-lg font-bold border border-emerald-500/40 flex items-center gap-1">
                        <span>🌿</span>
                        <span>{isAr ? 'نباتي' : 'Vegetarian'}</span>
                      </span>
                    )}
                    {selectedDishDetail.isSpicy && (
                      <span className="bg-red-500/20 text-red-300 text-[11px] px-2.5 py-1 rounded-lg font-bold border border-red-500/40 flex items-center gap-1">
                        <span>🌶️</span>
                        <span>{isAr ? 'حار' : 'Spicy'}</span>
                      </span>
                    )}
                  </div>

                  {/* Dish Title */}
                  <div>
                    <h3 className="text-xl sm:text-2xl md:text-3xl font-black text-slate-100 leading-snug">
                      {isAr ? (selectedDishDetail.nameAr || selectedDishDetail.nameEn) : (selectedDishDetail.nameEn || selectedDishDetail.nameAr)}
                    </h3>
                  </div>

                  {/* DEDICATED MEAL DESCRIPTION BOX (شرح الوجبة تحت الصورة) */}
                  <div className="p-4 sm:p-5 rounded-2xl bg-black/45 border border-gold-500/25 space-y-2.5">
                    <div className="flex items-center space-x-2 rtl:space-x-reverse text-gold-400 text-xs sm:text-sm font-bold uppercase tracking-wider">
                      <Icon name="sparkles" className="w-4 h-4 text-gold-400 flex-shrink-0" />
                      <span>{isAr ? 'شرح الوجبة والمكونات' : 'Meal Description & Ingredients'}</span>
                    </div>

                    {/* Primary Description in active language only */}
                    <p className="text-xs sm:text-sm text-slate-200 leading-relaxed font-normal whitespace-pre-line">
                      {(isAr ? selectedDishDetail.descAr : selectedDishDetail.descEn) ||
                       (isAr ? 'وجبة فاخرة محضرة بعناية من أجود المكونات الطازجة لدى جانغل لاونج.' : 'Exquisite luxury offering carefully prepared with the freshest ingredients at Jungle Lounge.')}
                    </p>
                  </div>

                  {/* Modal Footer: Price & Close Button */}
                  <div className="pt-2 flex items-center justify-between">
                    <div>
                      <span className="text-[11px] text-slate-400 block">{isAr ? 'السعر' : 'Price'}</span>
                      <span className="text-lg sm:text-xl font-black text-gold-300">{formatPrice(selectedDishDetail.price)}</span>
                    </div>

                    <button
                      onClick={() => setSelectedDishDetail(null)}
                      className="px-5 py-2 rounded-xl bg-gold-500 hover:bg-gold-400 active:scale-95 text-obsidian-950 font-bold text-xs sm:text-sm transition shadow-gold-glow-sm"
                    >
                      {isAr ? 'إغلاق' : 'Close'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* LUXURY FOOTER (Logo + Name + Exact Address + Copyright) */}
          <footer className="border-t border-gold-500/20 bg-jungle-950 py-8 sm:py-10 px-3 sm:px-6 lg:px-8 text-xs text-slate-400">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left rtl:md:text-right">
              <div className="flex items-center space-x-3 rtl:space-x-reverse justify-center md:justify-start">
                {settings.logoUrl ? (
                  <img
                    src={settings.logoUrl}
                    alt="Logo"
                    className="w-12 h-12 rounded-full border border-gold-500/40 object-cover"
                    onError={(e) => { e.target.style.display = 'none'; }}
                  />
                ) : null}
                <div>
                  <h4 className="font-bold text-slate-200 tracking-wider text-sm uppercase">
                    {isAr ? settings.restaurantNameAr : settings.restaurantNameEn}
                  </h4>
                  <p className="text-[11px] text-slate-300 font-medium mt-0.5">{isAr ? settings.addressAr : settings.addressEn}</p>
                </div>
              </div>

              <div className="flex items-center justify-center text-[11px] text-slate-500">
                <span>© 2026 {isAr ? settings.restaurantNameAr : settings.restaurantNameEn}. {isAr ? 'جميع الحقوق محفوظة' : 'All rights reserved'}.</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<JungleLoungeApp />);
  </script>
</body>

</html>
